# The native toolchain on Linux, macOS and Windows (tools/xbox/setup.sh, as
# a user's `n64rx doctor --install` runs it), the platform-and-runtime XBE,
# the host tests, and the ROM-free end-to-end run: the test ROM
# (tools/xbox/make_test_rom.py, assembled here, no Nintendo code) through
# `n64rx build` to a linking XBE. A fourth job builds the multi-arch SDK
# image and pushes it to GHCR when its inputs change. No job ever has a game
# ROM (PLAN.md 4.6).
#
# Manual only (the maintainer's free Actions minutes; macOS counts 10x and
# Windows 2x on a private repository): run it when a milestone needs the
# three-OS check, e.g. `gh workflow run build.yml --ref dev`, and add
# `-f image=true` to rebuild and push the SDK image (its pins changed).
name: build

on:
  workflow_dispatch:
    inputs:
      image:
        description: "also build and push the multi-arch SDK image"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Windows: the runner's own MSYS2 in C:\msys64; setup.sh installs the packages into it
      - name: Toolchain locations
        run: |
          # Windows: the defaults everywhere (MSYS2 in C:/msys64, nxdk in C:/xdev/nxdk)
          if [ "$RUNNER_OS" != Windows ]; then
            echo "NXDK_DIR=$HOME/toolchain/nxdk" >> "$GITHUB_ENV"
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            echo "LLVM=$HOME/toolchain/llvm21" >> "$GITHUB_ENV"
          fi

      # nxdk, LLVM and N64Recomp take most of the time; they change with setup.sh or the pins
      - name: Toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            ~/toolchain
            C:/xdev/nxdk
            build-host/recomp
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/xbox/setup.sh') }}-${{ hashFiles('.gitmodules') }}-recomp-ffb39cd

      - name: Toolchain (tools/xbox/setup.sh)
        run: bash tools/xbox/setup.sh

      - name: Homebrew's LLVM 21 and lld on the PATH (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "LLVM=$(brew --prefix llvm@21)" >> "$GITHUB_ENV"
          if brew --prefix lld@21 >/dev/null 2>&1; then echo "$(brew --prefix lld@21)/bin" >> "$GITHUB_PATH"; fi

      - name: n64rx doctor
        run: python tools/n64rx/n64rx.py doctor

      - name: Host tests
        run: |
          python tools/xbox/rom_leak_check.py
          python tools/xbox/test_pad_combo.py
          python tools/xbox/test_splash.py
          python tools/xbox/test_settings.py
          python tools/xbox/test_recomp_h.py
          python tools/xbox/test_syms.py
          python tools/xbox/test_scan64.py
          python tools/xbox/test_time.py
          python tools/xbox/test_interp.py
          python tools/xbox/test_xbe_rom.py
          python tools/xbox/test_romcache.py
          python tools/xbox/test_saves.py
          python tools/xbox/test_f3dex.py
          python tools/xbox/test_fbfx.py
          python tools/xbox/test_yaz0.py
          python tools/xbox/test_asp_hle.py --bench 0

      - name: The platform and runtime alone (no game)
        run: |
          if [ "$RUNNER_OS" = Windows ]; then tools/xbox/msys/build.sh; else xbox/build.sh; fi

      - name: n64rx tests
        run: python tools/xbox/test_n64rx.py

      - name: End to end, ROM-free (the test ROM through n64rx build)
        run: |
          python tools/xbox/make_test_rom.py build-host/test/test.z64
          python tools/n64rx/n64rx.py build build-host/test/test.z64 --engine native --out out
          ls -la "out/N64Recomp-X test"

      - uses: actions/upload-artifact@v4
        with:
          name: n64recomp-x-${{ runner.os }}
          path: |
            build-xbox/xbe/default.xbe
            build-xbox/n64recomp_x.map
          if-no-files-found: error
          retention-days: 14

  sdk-image:
    if: inputs.image
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Image tag
        id: tag
        run: echo "image=$(cat tools/xbox/docker/IMAGE)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/xbox/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
