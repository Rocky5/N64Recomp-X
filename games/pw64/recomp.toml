# N64Recomp config for Pilotwings 64 (US, NPWE). n64rx fills in @ROM@ and @OUT@.
[input]
entrypoint = 0x80200050
symbols_file_path = "pw64.us.syms.toml"
rom_file_path = "@ROM@"
output_func_path = "@OUT@"
recomp_include = "#include \"recomp.h\""
functions_per_output_file = 50

[patches]
# func_80231A10 (kernel/decompress_mio0.s, handwritten): mfc0 v0, Count;
# mtc0 a0, Count. The recompiler has no COP0 Count and stops on it. Nothing
# in the game calls it (no reference in the generated code), so it is left
# out; if a call ever appears, the link names it and the runtime's clock
# (osGetCount / osSetCount, ultra/time.c) gives it a body.
ignored = ["func_80231A10"]

# _uvScDlistRecover (kernel/sched.c, the RSP/RDP timeout recovery) writes the
# RSP's status register (sw t6, 0x10(t7) with t7 = 0xA4040000: SP_STATUS_REG,
# KSEG1). There is no RSP; the recovery's messages are kept and the register
# write becomes a nop (Wings64-X's patches/018, the same site).
[[patches.instruction]]
func = "_uvScDlistRecover"
vram = 0x8022B678
value = 0x00000000
