# N64Recomp config for the test pack. n64rx fills in the paths (the ROM is
# built by tools/xbox/make_test_rom.py, never committed).
[input]
entrypoint = 0x80000400
symbols_file_path = "test.syms.toml"
rom_file_path = "@ROM@"
output_func_path = "@OUT@"
recomp_include = "#include \"recomp.h\""
functions_per_output_file = 50
